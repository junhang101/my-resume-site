
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Certificate | Jun Hang</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1120;
            font-family: Arial, sans-serif;
        }

        .pdf-container {
            width: 100%;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="pdf-container">
    <iframe id="certificateViewer"></iframe>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const certificate = params.get("file");

    const allowedCertificates = [
        "ccna-introduction-to-networks.pdf",
        "oop-certificate.pdf",
        "sem-certificate.pdf",
        "live-streaming-certificate.pdf",
        "shopee-certificate.pdf",
        "payment-gateway-certificate.pdf",
        "whatsapp-business-certificate.pdf",
        "mobile-application-certificate.pdf",
        "tiktok-certificate.pdf"
    ];

    if (allowedCertificates.includes(certificate)) {
        document.getElementById("certificateViewer").src =
            "certificates/" + certificate;
    } else {
        document.body.innerHTML =
            "<h2 style='color:white;text-align:center;padding:40px;'>Certificate not found.</h2>";
    }
</script>

</body>
</html>
